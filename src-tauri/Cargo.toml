[package]
name = "agentlens"
default-run = "agentlens"
version = "0.1.1"
description = "A private, cross-platform resource monitor for AI agents"
authors = ["AgentLens"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "agentlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
dirs = "6"
trash = "5"
uuid = { version = "1", features = ["v4"] }
notify = "8"
libc = "0.2"
window-vibrancy = "0.8"

[dev-dependencies]
tempfile = "3"
