<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>AgentLens · 介绍视频</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
        background: #07121f;
        color: #edf5f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 40px 5vw 50px;
        background: radial-gradient(ellipse at 75% 15%, #12303b 0, transparent 65%);
      }
      main {
        max-width: 1360px;
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }
      header img {
        width: 54px;
        height: 54px;
      }
      h1 {
        margin: 0;
        font-size: 27px;
        letter-spacing: -0.5px;
      }
      header p {
        margin: 5px 0 0;
        color: #a2b6c4;
        font-size: 14px;
      }
      video {
        display: block;
        width: 100%;
        border: 1px solid #36515e;
        border-radius: 14px;
        box-shadow: 0 25px 90px #0007;
        background: #050b15;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-top: 23px;
        color: #a6bbc9;
        font-size: 14px;
      }
      a {
        color: #85e5d9;
        text-decoration: none;
        margin-left: 20px;
      }
      a:hover {
        text-decoration: underline;
      }
      strong {
        color: #ecf6f8;
        font-weight: 500;
      }
      @media (max-width: 700px) {
        body {
          padding: 24px 4vw;
        }
        footer {
          display: block;
          line-height: 2;
        }
        a {
          margin: 0 18px 0 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img
          src="../../public/icon.svg"
          alt="AgentLens"
        />
        <div>
          <h1>让 AI 开发的资源消耗，清晰可见。</h1>
          <p>AgentLens · Your agents, in focus.</p>
        </div>
      </header>
      <video
        controls
        playsinline
        preload="metadata"
        poster="../media/agentlens-poster.jpg"
      >
        <source
          src="../media/agentlens-intro-zh.mp4"
          type="video/mp4"
        />
        <track
          kind="captions"
          src="../media/agentlens-intro-zh.vtt"
          srclang="zh-CN"
          label="简体中文"
        />
        你的浏览器不支持内嵌视频，请下载 MP4。
      </video>
      <footer>
        <span>
          <strong>68.3 秒</strong>
          · 1080p / 30 fps · 中文旁白约 1.6 倍语速 · 已内嵌字幕
        </span>
        <span>
          <a
            href="../media/agentlens-intro-zh.mp4"
            download
          >
            下载视频
          </a>
          <a
            href="../media/agentlens-intro-zh.srt"
            download
          >
            下载字幕
          </a>
        </span>
      </footer>
    </main>
  </body>
</html>
